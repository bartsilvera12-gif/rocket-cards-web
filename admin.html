<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Rocket Cards</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script src="/rocketcards-config.js"></script>
<style>
  :root {
    --fondo: #050505; --panel: #0D0D0D; --panel2: #121212;
    --linea: #1f1f1f; --linea2: #2a2a2a;
    --texto: #F5F5F5; --suave: #A7A7A7; --tenue: #6e6e6e;
    --rojo: #E30613; --oro: #C9A227; --verde: #3FB950;
    --titulo: 'Saira Condensed', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--titulo); text-transform: uppercase; margin: 0; line-height: 1; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--oro); }

  /* ── Estructura ── */
  .barra {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
    gap: 16px; padding: 12px clamp(14px, 3vw, 28px);
    background: rgba(5,5,5,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linea);
  }
  .marca { font-family: var(--titulo); font-weight: 900; font-size: 19px; letter-spacing: .04em; }
  .marca em { color: var(--rojo); font-style: normal; }
  .barra .crece { flex: 1; }

  .pestanas { display: flex; gap: 2px; overflow-x: auto; padding: 0 clamp(14px, 3vw, 28px);
              border-bottom: 1px solid var(--linea); background: var(--fondo);
              position: sticky; top: 53px; z-index: 19; }
  .pestanas button {
    background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
    padding: 12px 14px; font-family: var(--titulo); font-weight: 800; font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--suave); white-space: nowrap;
  }
  .pestanas button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--rojo); }
  .pestanas button:hover { color: var(--texto); }

  main { padding: clamp(16px, 3vw, 28px); max-width: 1500px; margin: 0 auto; }

  /* ── Estado de la conexión ── */
  .vivo { display: flex; align-items: center; gap: 7px; font-family: var(--mono);
          font-size: 10.5px; letter-spacing: .1em; color: var(--tenue); white-space: nowrap; }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--tenue); flex: 0 0 auto; }
  .vivo[data-on="1"] .punto { background: var(--verde); box-shadow: 0 0 0 3px rgba(63,185,80,.16); }
  .vivo[data-on="0"] .punto { background: var(--rojo); }

  /* ── Controles ── */
  input[type=text], input[type=number], input[type=password], input[type=search], select, textarea {
    background: var(--panel); border: 1px solid var(--linea2); color: var(--texto);
    padding: 9px 11px; border-radius: 3px; width: 100%; outline: 0;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--oro); }
  input[type=number] { font-family: var(--mono); }
  label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
          text-transform: uppercase; color: var(--suave); margin-bottom: 5px; }
  .btn {
    background: var(--rojo); border: 0; color: #fff; cursor: pointer;
    font-family: var(--titulo); font-weight: 800; font-size: 12.5px; letter-spacing: .12em;
    text-transform: uppercase; padding: 10px 18px; border-radius: 3px;
  }
  .btn.gris { background: var(--panel2); border: 1px solid var(--linea2); color: var(--texto); }
  .btn.oro { background: var(--oro); color: #050505; }
  .btn.chico { padding: 6px 11px; font-size: 11px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .icono { background: none; border: 1px solid var(--linea2); color: var(--suave);
           cursor: pointer; border-radius: 3px; padding: 5px 9px; font-size: 13px; line-height: 1; }
  .icono:hover { color: var(--texto); border-color: var(--oro); }
  .icono.peligro:hover { color: var(--rojo); border-color: var(--rojo); }

  /* ── Tabla ── */
  .caja { background: var(--panel); border: 1px solid var(--linea); border-radius: 4px; }
  .herramientas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
                  padding: 12px; border-bottom: 1px solid var(--linea); }
  .herramientas input[type=search] { max-width: 300px; }
  .herramientas select { max-width: 190px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
       color: var(--suave); text-align: left; font-weight: 500; padding: 10px 12px;
       border-bottom: 1px solid var(--linea); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid #141414; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #0F0F0F; }
  .sku { font-family: var(--mono); font-size: 11px; color: var(--oro); }
  .nom { font-weight: 600; font-size: 13px; }
  .col { font-size: 11.5px; color: var(--suave); }
  .foto { width: 46px; height: 46px; object-fit: contain; background: #Fff; border-radius: 3px;
          border: 1px solid var(--linea2); }
  .sinfoto { width: 46px; height: 46px; border-radius: 3px; border: 1px dashed var(--linea2);
             display: grid; place-items: center; color: var(--tenue); font-size: 9px; }
  .num { width: 108px; text-align: right; font-family: var(--mono); padding: 6px 8px; }
  .acciones { display: flex; gap: 5px; justify-content: flex-end; }
  .pildora { display: inline-block; font-family: var(--titulo); font-weight: 800; font-size: 9.5px;
             letter-spacing: .14em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px; }
  .vacio { padding: 40px 16px; text-align: center; color: var(--suave); }

  /* ── Interruptor ── */
  .sw { position: relative; width: 38px; height: 21px; flex: 0 0 auto; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; background: #262626; border-radius: 11px; transition: background .18s; pointer-events: none; }
  .sw span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 15px; height: 15px;
                    border-radius: 50%; background: var(--suave); transition: transform .18s, background .18s; }
  .sw input:checked + span { background: rgba(63,185,80,.3); }
  .sw input:checked + span::after { transform: translateX(17px); background: var(--verde); }

  /* ── Modal ── */
  .velo { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.72);
          display: grid; place-items: center; padding: 16px; overflow: auto; }
  .modal { background: var(--panel); border: 1px solid var(--linea2); border-radius: 5px;
           width: min(680px, 100%); max-height: 92vh; overflow: auto;
           box-shadow: 0 30px 80px rgba(0,0,0,.75); }
  .modal header { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
                  border-bottom: 1px solid var(--linea); position: sticky; top: 0; background: var(--panel); }
  .modal .cuerpo { padding: 20px; display: grid; gap: 14px;
                   grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .modal .cuerpo .ancho { grid-column: 1 / -1; }
  .modal footer { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 20px;
                  border-top: 1px solid var(--linea); position: sticky; bottom: 0; background: var(--panel); }

  /* ── Login ── */
  .entrada { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .entrada form { width: min(360px, 100%); display: grid; gap: 14px;
                  background: var(--panel); border: 1px solid var(--linea); padding: 28px; border-radius: 5px; }

  /* ── Avisos ── */
  .aviso { padding: 10px 13px; border-radius: 3px; font-size: 13px; border-left: 3px solid; }
  .aviso.mal { background: rgba(227,6,19,.1); border-color: var(--rojo); }
  .aviso.bien { background: rgba(63,185,80,.1); border-color: var(--verde); }
  #brindis { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80;
             display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  #brindis div { background: #0D0D0D; border: 1px solid var(--linea2); border-left: 3px solid var(--oro);
                 padding: 11px 16px; font-size: 13px; box-shadow: 0 16px 40px rgba(0,0,0,.7);
                 animation: subir .25s ease; }
  @keyframes subir { from { opacity: 0; transform: translateY(10px); } }

  .fila { display: flex; align-items: center; gap: 10px; }
  .ayuda { font-size: 11.5px; color: var(--tenue); margin-top: 4px; }
  .orden { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  .orden li { display: flex; align-items: center; gap: 10px; background: var(--panel2);
              border: 1px solid var(--linea); border-radius: 3px; padding: 8px 10px; }
  .orden { list-style: none; margin: 0; }
  .orden .pos { font-family: var(--titulo); font-weight: 900; font-style: italic; font-size: 18px;
                color: var(--oro); min-width: 26px; }
  @media (max-width: 760px) {
    .ocultar-chico { display: none; }
    main { padding: 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="brindis"></div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────
// Panel de Rocket Cards
//
// Habla directo con Supabase por supabase-js: no hay servidor propio en el
// medio. Lo que decide qué puede hacer cada uno es RLS, del lado de la base
// (ver db/rocketcards.sql). El chequeo del email que hay acá abajo es sólo
// para no mostrarle la pantalla a quien no corresponde: si alguien lo saltea
// editando el JavaScript, igual no va a poder escribir una fila.
//
// Y nadie pregunta cada tantos segundos: la pantalla se suscribe por
// Realtime y vuelve a leer sólo cuando una fila cambió de verdad.
// ─────────────────────────────────────────────────────────────────────────

const cfg = window.ROCKET_CONFIG || {};
const listo = !!(cfg.url && cfg.anonKey && window.supabase);

const sb = listo
  ? window.supabase.createClient(cfg.url, cfg.anonKey, {
      db: { schema: cfg.schema || 'rocketcards' },
      auth: { persistSession: true, autoRefreshToken: true },
    })
  : null;

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const app = $('#app');

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const gs = (n) => 'Gs. ' + Number(n || 0).toLocaleString('es-PY');
const fecha = (s) => s ? new Date(s).toLocaleString('es-PY', { dateStyle: 'short', timeStyle: 'short' }) : '—';

function brindis(texto, mal) {
  const d = document.createElement('div');
  d.textContent = texto;
  if (mal) d.style.borderLeftColor = 'var(--rojo)';
  $('#brindis').append(d);
  setTimeout(() => d.remove(), 3600);
}

/** Traduce los errores de PostgREST a algo que se entienda. */
function motivo(err) {
  if (!err) return 'Error desconocido';
  const m = err.message || String(err);
  if (err.code === '42501' || /row-level security|No autorizado/i.test(m)) {
    return 'La base rechazó el cambio: esta cuenta no es el admin.';
  }
  if (err.code === '23505') {
    return /nuevo_orden/.test(m)
      ? 'Ya hay otro producto en esa posición de Nuevos ingresos'
      : 'Ya existe un producto con ese SKU';
  }
  if (err.code === '23503') return 'Esa categoría no existe, o todavía tiene productos';
  if (err.code === '23514') return 'Algún valor no cumple las reglas de la base';
  if (err.code === 'PGRST205' || /schema cache/i.test(m)) {
    return 'PostgREST no ve el esquema. Agregá "rocketcards" a Exposed schemas y corré: notify pgrst, \'reload schema\';';
  }
  if (/Failed to fetch|NetworkError/i.test(m)) return 'No llego a Supabase. ¿Está bien la URL en rocketcards-config.js?';
  return m;
}

// ── Estado ───────────────────────────────────────────────────────────────

const estado = {
  sesion: null,
  pestana: 'productos',
  productos: [], categorias: [], movimientos: [],
  busqueda: '', filtroCat: '', soloOcultos: false,
  version: null, conectado: false,
  editando: null,
  cambioPropio: 0,
  pendiente: null,
};

// ── Realtime ─────────────────────────────────────────────────────────────

let canal = null;
function escuchar() {
  if (canal) sb.removeChannel(canal);
  const alCambiar = () => novedad();
  canal = sb.channel('panel-rocketcards')
    .on('postgres_changes', { event: '*', schema: cfg.schema, table: 'producto' }, alCambiar)
    .on('postgres_changes', { event: '*', schema: cfg.schema, table: 'categoria' }, alCambiar)
    .subscribe((st) => {
      estado.conectado = st === 'SUBSCRIBED';
      pintarEstado();
    });
}

function novedad() {
  // El eco de nuestro propio cambio: la respuesta ya actualizó la pantalla.
  if (Date.now() - estado.cambioPropio < 2500) { leerVersion(); return; }
  // Si estás escribiendo, repintar te sacaría el cursor del campo.
  if (escribiendo()) { diferir(); return; }
  aplicarNovedad().catch((e) => brindis(motivo(e), true));
}

const escribiendo = () => {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('#hoja, .modal') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
};

let reloj = null;

/**
 * Guarda la novedad para después y vuelve a mirar cada tanto. El focusout es
 * el camino normal; esto es la red para que un cursor olvidado en un input no
 * deje la pantalla desactualizada para siempre.
 */
function diferir() {
  estado.pendiente = true;
  pintarEstado();
  clearTimeout(reloj);
  reloj = setTimeout(function revisar() {
    if (!escribiendo()) return aplicarNovedad().catch((e) => brindis(motivo(e), true));
    reloj = setTimeout(revisar, 1500);
  }, 1500);
}

async function aplicarNovedad() {
  clearTimeout(reloj);
  estado.pendiente = null;
  await cargar();
  brindis('El catálogo cambió (v' + (estado.version ?? '—') + '). Actualicé la pantalla.');
}

document.addEventListener('focusout', () => {
  if (!estado.pendiente) return;
  // Margen para que el foco salte al campo siguiente sin repintar en el medio.
  setTimeout(() => {
    if (estado.pendiente && !escribiendo()) {
      aplicarNovedad().catch((e) => brindis(motivo(e), true));
    }
  }, 150);
});

function pintarEstado() {
  const el = $('#vivo');
  if (!el) return;
  el.dataset.on = estado.conectado ? '1' : '0';
  el.lastElementChild.textContent = !estado.conectado
    ? 'SIN CONEXIÓN'
    : estado.pendiente
      ? 'NOVEDAD'
      : 'EN VIVO · v' + (estado.version ?? '—');
}

// ── Carga ────────────────────────────────────────────────────────────────

async function leerVersion() {
  const { data } = await sb.from('version').select('version').maybeSingle();
  if (data) { estado.version = data.version; pintarEstado(); }
}

async function cargar() {
  const [p, c] = await Promise.all([
    sb.from('producto').select('*').order('nombre'),
    sb.from('categoria').select('*').order('orden'),
  ]);
  if (p.error) throw p.error;
  if (c.error) throw c.error;

  const porCat = {};
  p.data.forEach((x) => { porCat[x.categoria] = (porCat[x.categoria] || 0) + 1; });

  estado.categorias = c.data.map((x) => Object.assign({}, x, { productos: porCat[x.key] || 0 }));
  const nombreDe = Object.fromEntries(estado.categorias.map((x) => [x.key, x.nombre]));
  estado.productos = p.data.map((x) => Object.assign({}, x, { categoria_nombre: nombreDe[x.categoria] }));

  if (estado.pestana === 'historial') {
    const a = await sb.from('auditoria').select('*').order('id', { ascending: false }).limit(80);
    estado.movimientos = a.error ? [] : a.data;
  }
  await leerVersion();
  pintar();
}

/** Marca que lo que viene por Realtime en seguida es eco nuestro. */
const propio = () => { estado.cambioPropio = Date.now(); };

// ── Entrar ───────────────────────────────────────────────────────────────

function pintarEntrada(error) {
  app.innerHTML = `
    <div class="entrada">
      <form id="f-login" autocomplete="on">
        <div>
          <div class="marca">ROCKET <em>CARDS</em></div>
          <div class="ayuda">Panel de administración</div>
        </div>
        ${error ? `<div class="aviso mal">${esc(error)}</div>` : ''}
        <div>
          <label for="u">Email</label>
          <input id="u" name="username" type="email" autocomplete="username" required autofocus
                 value="${esc(cfg.adminEmail || '')}">
        </div>
        <div>
          <label for="c">Contraseña</label>
          <input id="c" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" ${listo ? '' : 'disabled'}>Entrar</button>
      </form>
    </div>`;

  $('#f-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const boton = $('#f-login button');
    boton.disabled = true;
    const { error: err } = await sb.auth.signInWithPassword({
      email: $('#u').value.trim(), password: $('#c').value,
    });
    if (err) {
      pintarEntrada(/Invalid login/i.test(err.message)
        ? 'Email o contraseña incorrectos'
        : motivo(err));
      return;
    }
    arrancar();
  });
}

// ── Pantalla principal ───────────────────────────────────────────────────

const PESTANAS = [
  ['productos', 'Productos'],
  ['nuevos', 'Nuevos ingresos'],
  ['categorias', 'Categorías'],
  ['historial', 'Historial'],
];

function pintar() {
  if (!estado.sesion) return pintarEntrada();

  app.innerHTML = `
    <div class="barra">
      <div class="marca">ROCKET <em>CARDS</em></div>
      <div class="crece"></div>
      <div class="vivo" id="vivo" data-on="0"><i class="punto"></i><span>…</span></div>
      <a href="/" target="_blank" rel="noopener" class="ocultar-chico"
         style="font-size:12px;color:var(--suave);text-decoration:none">Ver tienda ↗</a>
      <button class="icono" id="salir" title="Cerrar sesión">${esc(estado.sesion.user.email)} · salir</button>
    </div>
    <nav class="pestanas" role="tablist">
      ${PESTANAS.map(([k, t]) => `
        <button role="tab" data-ir="${k}" aria-selected="${estado.pestana === k}">${t}</button>`).join('')}
    </nav>
    <main id="hoja"></main>`;

  $('#salir').addEventListener('click', async () => {
    if (canal) sb.removeChannel(canal);
    await sb.auth.signOut();
    estado.sesion = null;
    pintar();
  });
  app.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', async () => {
    estado.pestana = b.dataset.ir;
    pintar();
    if (estado.pestana === 'historial') await cargar().catch((e) => brindis(motivo(e), true));
  }));

  pintarEstado();
  ({
    productos: hojaProductos,
    nuevos: hojaNuevos,
    categorias: hojaCategorias,
    historial: hojaHistorial,
  })[estado.pestana]($('#hoja'));

  if (estado.editando) pintarModal();
}

// ── Productos ────────────────────────────────────────────────────────────

function filtrados() {
  const q = estado.busqueda.trim().toLowerCase();
  return estado.productos.filter((p) => {
    if (estado.filtroCat && p.categoria !== estado.filtroCat) return false;
    if (estado.soloOcultos && p.publicado) return false;
    if (!q) return true;
    return (p.id + ' ' + p.nombre + ' ' + p.coleccion).toLowerCase().includes(q);
  });
}

function hojaProductos(hoja) {
  const lista = filtrados();
  hoja.innerHTML = `
    <div class="caja">
      <div class="herramientas">
        <input type="search" id="q" placeholder="Buscar por nombre o SKU…" value="${esc(estado.busqueda)}">
        <select id="fc">
          <option value="">Todas las categorías</option>
          ${estado.categorias.map((c) => `
            <option value="${esc(c.key)}" ${estado.filtroCat === c.key ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}
        </select>
        <label class="fila" style="margin:0;text-transform:none;letter-spacing:0;font-family:inherit;font-size:12.5px;color:var(--suave)">
          <input type="checkbox" id="oc" ${estado.soloOcultos ? 'checked' : ''} style="width:auto"> Sólo ocultos
        </label>
        <div style="flex:1"></div>
        <span class="col">${lista.length} de ${estado.productos.length}</span>
        <button class="btn" id="nuevo">+ Producto</button>
      </div>
      ${lista.length ? `
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th></th><th>Producto</th><th class="ocultar-chico">Categoría</th>
          <th style="text-align:right">Precio</th><th style="text-align:right">Stock</th>
          <th>Visible</th><th></th>
        </tr></thead>
        <tbody>
        ${lista.map((p) => `
          <tr data-id="${esc(p.id)}">
            <td>${p.img
              ? `<img class="foto" src="${esc(p.img)}" alt="" loading="lazy">`
              : `<div class="sinfoto">sin foto</div>`}</td>
            <td>
              <div class="nom">${esc(p.nombre)}</div>
              <div class="sku">${esc(p.id)}${p.etiqueta ? ' · ' + esc(p.etiqueta) : ''}${p.nuevo_orden ? ' · nuevos #' + p.nuevo_orden : ''}</div>
            </td>
            <td class="ocultar-chico col">${esc(p.categoria_nombre || p.categoria)}</td>
            <td style="text-align:right">
              <input class="num" type="number" min="0" step="1000" value="${p.precio}" data-campo="precio">
              ${p.precio_anterior ? `<div class="col" style="text-align:right">antes ${gs(p.precio_anterior)}</div>` : ''}
            </td>
            <td style="text-align:right">
              <input class="num" style="width:76px" type="number" min="0" step="1" value="${p.stock}" data-campo="stock">
            </td>
            <td>
              <label class="sw"><input type="checkbox" data-campo="publicado" ${p.publicado ? 'checked' : ''}><span></span></label>
            </td>
            <td><div class="acciones">
              <button class="icono" data-editar title="Editar">✎</button>
              <button class="icono peligro" data-borrar title="Borrar">✕</button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table></div>` : `<div class="vacio">No hay productos que coincidan.</div>`}
    </div>
    <p class="ayuda">El precio y el stock se guardan al salir del campo. Cada cambio llega a la tienda al instante.</p>`;

  $('#q').addEventListener('input', (e) => {
    estado.busqueda = e.target.value;
    const foco = document.activeElement === e.target;
    hojaProductos(hoja);
    if (foco) { const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  $('#fc').addEventListener('change', (e) => { estado.filtroCat = e.target.value; hojaProductos(hoja); });
  $('#oc').addEventListener('change', (e) => { estado.soloOcultos = e.target.checked; hojaProductos(hoja); });
  $('#nuevo').addEventListener('click', () => { estado.editando = { nuevo: true }; pintarModal(); });

  hoja.querySelectorAll('tbody tr').forEach((tr) => {
    const id = tr.dataset.id;
    const p = estado.productos.find((x) => x.id === id);

    tr.querySelectorAll('input[data-campo]').forEach((campo) => {
      const guardar = async () => {
        const valor = campo.type === 'checkbox' ? campo.checked : Number(campo.value);
        if (valor === p[campo.dataset.campo]) return;
        campo.disabled = true;
        propio();
        const { data, error } = await sb.from('producto')
          .update({ [campo.dataset.campo]: valor }).eq('id', id).select().maybeSingle();
        campo.disabled = false;
        if (error || !data) {
          brindis(error ? motivo(error) : 'La base no aceptó el cambio', true);
          if (campo.type === 'checkbox') campo.checked = p[campo.dataset.campo];
          else campo.value = p[campo.dataset.campo];
          return;
        }
        Object.assign(p, data);
        brindis(p.nombre.slice(0, 34) + ': listo');
      };
      if (campo.type === 'checkbox') campo.addEventListener('change', guardar);
      else {
        campo.addEventListener('blur', guardar);
        campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') campo.blur(); });
      }
    });

    tr.querySelector('[data-editar]').addEventListener('click', () => {
      estado.editando = Object.assign({}, p);
      pintarModal();
    });
    tr.querySelector('[data-borrar]').addEventListener('click', async () => {
      if (!confirm('¿Borrar "' + p.nombre + '"?\n\nNo se puede deshacer. Si sólo querés sacarlo de la tienda, apagá "Visible".')) return;
      propio();
      const { error } = await sb.from('producto').delete().eq('id', id);
      if (error) return brindis(motivo(error), true);
      estado.productos = estado.productos.filter((x) => x.id !== id);
      hojaProductos(hoja);
      brindis('Borrado');
    });
  });
}

// ── Modal de producto ────────────────────────────────────────────────────

function pintarModal() {
  const p = estado.editando;
  const esNuevo = !!p.nuevo;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `
    <form class="modal" id="f-prod">
      <header>
        <h2 style="font-size:18px">${esNuevo ? 'Nuevo producto' : 'Editar producto'}</h2>
        <div style="flex:1"></div>
        <button type="button" class="icono" id="cerrar">✕</button>
      </header>
      <div class="cuerpo">
        <div id="err" class="ancho" style="display:none"></div>
        <div>
          <label for="m-id">SKU</label>
          <input id="m-id" type="text" value="${esc(p.id || '')}" ${esNuevo ? 'required' : 'disabled'}>
          <div class="ayuda">${esNuevo ? 'Se muestra en el buscador. Ej: SV-PIKA-238' : 'No se puede cambiar.'}</div>
        </div>
        <div>
          <label for="m-cat">Categoría</label>
          <select id="m-cat" required>
            ${estado.categorias.map((c) => `
              <option value="${esc(c.key)}" ${p.categoria === c.key ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}
          </select>
        </div>
        <div class="ancho">
          <label for="m-nom">Nombre</label>
          <input id="m-nom" type="text" value="${esc(p.nombre || '')}" required>
        </div>
        <div class="ancho">
          <label for="m-col">Colección</label>
          <input id="m-col" type="text" value="${esc(p.coleccion || '')}" placeholder="Mega Evolution · ETB">
        </div>
        <div class="ancho">
          <label for="m-img">Imagen</label>
          <input id="m-img" type="text" value="${esc(p.img || '')}" placeholder="/assets/catalogo/foto.webp">
          <div class="ayuda">Ruta dentro del sitio. La foto se sube a <code>assets/</code> con el repo.</div>
        </div>
        <div>
          <label for="m-precio">Precio (Gs.)</label>
          <input id="m-precio" type="number" min="0" step="1000" value="${p.precio ?? ''}" required>
        </div>
        <div>
          <label for="m-antes">Precio anterior</label>
          <input id="m-antes" type="number" min="0" step="1000" value="${p.precio_anterior ?? ''}" placeholder="vacío = sin oferta">
        </div>
        <div>
          <label for="m-stock">Stock</label>
          <input id="m-stock" type="number" min="0" step="1" value="${p.stock ?? 0}">
        </div>
        <div>
          <label for="m-tag">Etiqueta</label>
          <select id="m-tag">
            ${['', 'NUEVO', 'OFERTA', 'PREVENTA', 'ÚLTIMAS UNIDADES', 'AGOTADO'].map((t) => `
              <option value="${esc(t)}" ${(p.etiqueta || '') === t ? 'selected' : ''}>${t || '— sin etiqueta —'}</option>`).join('')}
          </select>
        </div>
        <label class="fila ancho" style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:13px;color:var(--texto)">
          <span class="sw"><input type="checkbox" id="m-pub" ${p.publicado !== false ? 'checked' : ''}><span></span></span>
          Visible en la tienda
        </label>
        <label class="fila ancho" style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:13px;color:var(--texto)">
          <span class="sw"><input type="checkbox" id="m-prem" ${p.premium ? 'checked' : ''}><span></span></span>
          Premium
        </label>
      </div>
      <footer>
        <button type="button" class="btn gris" id="cancelar">Cancelar</button>
        <button type="submit" class="btn">${esNuevo ? 'Crear' : 'Guardar'}</button>
      </footer>
    </form>`;
  document.body.append(velo);

  const cerrar = () => { velo.remove(); estado.editando = null; };
  velo.addEventListener('click', (e) => { if (e.target === velo) cerrar(); });
  $('#cerrar', velo).addEventListener('click', cerrar);
  $('#cancelar', velo).addEventListener('click', cerrar);
  document.addEventListener('keydown', function escapar(e) {
    if (e.key === 'Escape' && document.body.contains(velo)) { cerrar(); document.removeEventListener('keydown', escapar); }
  });

  $('#f-prod', velo).addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#err', velo);
    const boton = velo.querySelector('button[type=submit]');
    const antes = $('#m-antes', velo).value;
    const img = $('#m-img', velo).value.trim();

    // Las imágenes son rutas del propio sitio. Una URL que apunte afuera
    // convertiría el panel en una forma de incrustar contenido de terceros.
    if (img && (!img.startsWith('/') || img.startsWith('//') || img.includes('..'))) {
      err.className = 'aviso mal ancho';
      err.textContent = 'La imagen tiene que ser una ruta del sitio, como /assets/catalogo/foto.webp';
      err.style.display = '';
      return;
    }

    const datos = {
      nombre: $('#m-nom', velo).value.trim(),
      coleccion: $('#m-col', velo).value.trim(),
      categoria: $('#m-cat', velo).value,
      img,
      precio: Number($('#m-precio', velo).value),
      precio_anterior: antes === '' ? null : Number(antes),
      stock: Number($('#m-stock', velo).value || 0),
      etiqueta: $('#m-tag', velo).value || null,
      premium: $('#m-prem', velo).checked,
      publicado: $('#m-pub', velo).checked,
    };
    boton.disabled = true;
    err.style.display = 'none';
    propio();

    const r = esNuevo
      ? await sb.from('producto').insert(Object.assign({ id: $('#m-id', velo).value.trim() }, datos)).select().maybeSingle()
      : await sb.from('producto').update(datos).eq('id', p.id).select().maybeSingle();

    if (r.error || !r.data) {
      err.className = 'aviso mal ancho';
      err.textContent = r.error ? motivo(r.error) : 'La base no aceptó el cambio: esta cuenta no es el admin.';
      err.style.display = '';
      boton.disabled = false;
      return;
    }
    cerrar();
    await cargar();
    brindis(esNuevo ? 'Producto creado' : 'Guardado');
  });
}

// ── Nuevos ingresos ──────────────────────────────────────────────────────

function hojaNuevos(hoja) {
  const enCarrusel = estado.productos
    .filter((p) => p.nuevo_orden)
    .sort((a, b) => a.nuevo_orden - b.nuevo_orden);
  const resto = estado.productos
    .filter((p) => !p.nuevo_orden && p.publicado)
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

  hoja.innerHTML = `
    <div class="caja">
      <div class="herramientas">
        <h2 style="font-size:16px">Carrusel de la portada</h2>
        <div style="flex:1"></div>
        <button class="btn" id="guardar-orden" disabled>Guardar orden</button>
      </div>
      ${enCarrusel.length ? `<ul class="orden" id="lista">
        ${enCarrusel.map((p, i) => `
          <li data-id="${esc(p.id)}">
            <span class="pos">${String(i + 1).padStart(2, '0')}</span>
            ${p.img ? `<img class="foto" src="${esc(p.img)}" alt="" loading="lazy">` : '<div class="sinfoto">—</div>'}
            <div style="flex:1;min-width:0">
              <div class="nom">${esc(p.nombre)}</div>
              <div class="sku">${esc(p.id)}</div>
            </div>
            <button class="icono" data-sube title="Subir">↑</button>
            <button class="icono" data-baja title="Bajar">↓</button>
            <button class="icono peligro" data-saca title="Sacar del carrusel">✕</button>
          </li>`).join('')}
      </ul>` : '<div class="vacio">El carrusel está vacío.</div>'}
      <div class="herramientas" style="border-top:1px solid var(--linea);border-bottom:0">
        <select id="agregar" style="max-width:420px">
          <option value="">Agregar un producto al carrusel…</option>
          ${resto.map((p) => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}
        </select>
      </div>
    </div>
    <p class="ayuda">Hasta 12 productos. El orden es el que ve el cliente al deslizar.</p>`;

  let ids = enCarrusel.map((p) => p.id);
  const original = ids.join(',');
  const refrescar = () => {
    estado.productos.forEach((p) => {
      const i = ids.indexOf(p.id);
      p.nuevo_orden = i >= 0 ? i + 1 : null;
    });
    hojaNuevos(hoja);
    if (ids.join(',') !== original) $('#guardar-orden').disabled = false;
  };

  hoja.querySelectorAll('#lista li').forEach((li, i) => {
    li.querySelector('[data-sube]').disabled = i === 0;
    li.querySelector('[data-baja]').disabled = i === ids.length - 1;
    li.querySelector('[data-sube]').addEventListener('click', () => {
      [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]]; refrescar();
    });
    li.querySelector('[data-baja]').addEventListener('click', () => {
      [ids[i + 1], ids[i]] = [ids[i], ids[i + 1]]; refrescar();
    });
    li.querySelector('[data-saca]').addEventListener('click', () => { ids.splice(i, 1); refrescar(); });
  });

  $('#agregar').addEventListener('change', (e) => {
    if (!e.target.value) return;
    if (ids.length >= 12) return brindis('El carrusel no lleva más de 12', true);
    ids.push(e.target.value);
    refrescar();
  });

  $('#guardar-orden').addEventListener('click', async (e) => {
    e.target.disabled = true;
    propio();
    // Por función y no con dos UPDATE: adentro es una sola transacción, así
    // el carrusel no queda vacío en el medio para quien esté en la tienda.
    const { error } = await sb.rpc('guardar_nuevos', { ids });
    if (error) {
      brindis(motivo(error), true);
      e.target.disabled = false;
      return;
    }
    brindis('Orden guardado');
    await cargar();
  });
}

// ── Categorías ───────────────────────────────────────────────────────────

function hojaCategorias(hoja) {
  hoja.innerHTML = `
    <div class="caja">
      <div class="herramientas">
        <h2 style="font-size:16px">Categorías</h2>
        <div style="flex:1"></div>
        <button class="btn" id="nueva-cat">+ Categoría</button>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr>
          <th>Clave (URL)</th><th>Nombre</th><th class="ocultar-chico">Bajada</th>
          <th style="text-align:right">Productos</th><th style="text-align:right">Orden</th><th></th>
        </tr></thead>
        <tbody>
        ${estado.categorias.map((c) => `
          <tr data-key="${esc(c.key)}">
            <td><span class="sku">/catalogo/${esc(c.key)}</span></td>
            <td class="fila">
              <i style="width:10px;height:10px;border-radius:2px;background:${esc(c.accent)};display:inline-block"></i>
              <input type="text" value="${esc(c.nombre)}" data-campo="nombre" style="max-width:230px">
            </td>
            <td class="ocultar-chico"><input type="text" value="${esc(c.nota)}" data-campo="nota"></td>
            <td style="text-align:right" class="col">${c.productos}</td>
            <td style="text-align:right">
              <input class="num" style="width:68px" type="number" value="${c.orden}" data-campo="orden">
            </td>
            <td><div class="acciones">
              <button class="icono peligro" data-borrar title="Borrar" ${c.productos ? 'disabled' : ''}>✕</button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
    <p class="ayuda">La clave aparece en la URL y no se cambia desde acá. Una categoría con productos no se puede borrar.</p>`;

  hoja.querySelectorAll('tbody tr').forEach((tr) => {
    const key = tr.dataset.key;
    const c = estado.categorias.find((x) => x.key === key);
    tr.querySelectorAll('input[data-campo]').forEach((campo) => {
      const guardar = async () => {
        const valor = campo.type === 'number' ? Number(campo.value) : campo.value;
        if (String(valor) === String(c[campo.dataset.campo])) return;
        propio();
        const { data, error } = await sb.from('categoria')
          .update({ [campo.dataset.campo]: valor }).eq('key', key).select().maybeSingle();
        if (error || !data) {
          brindis(error ? motivo(error) : 'La base no aceptó el cambio', true);
          campo.value = c[campo.dataset.campo];
          return;
        }
        Object.assign(c, data);
        brindis('Guardado');
      };
      campo.addEventListener('blur', guardar);
      campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') campo.blur(); });
    });
    tr.querySelector('[data-borrar]').addEventListener('click', async () => {
      if (!confirm('¿Borrar la categoría "' + c.nombre + '"?')) return;
      propio();
      const { error } = await sb.from('categoria').delete().eq('key', key);
      if (error) return brindis(motivo(error), true);
      await cargar();
      brindis('Borrada');
    });
  });

  $('#nueva-cat').addEventListener('click', async () => {
    const nombre = prompt('Nombre de la categoría (ej: Accesorios)');
    if (!nombre) return;
    const key = prompt('Clave para la URL (minúsculas, sin espacios)',
      nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
    if (!key) return;
    propio();
    const { error } = await sb.from('categoria')
      .insert({ key, nombre, orden: estado.categorias.length + 1 });
    if (error) return brindis(motivo(error), true);
    await cargar();
    brindis('Categoría creada');
  });
}

// ── Historial ────────────────────────────────────────────────────────────

const ACCION = { alta: ['Alta', 'var(--verde)'], cambio: ['Cambio', 'var(--oro)'], baja: ['Baja', 'var(--rojo)'] };

/** Lista los campos que cambiaron, para no mostrar dos JSON enteros. */
function diferencias(m) {
  if (m.accion !== 'cambio' || !m.antes || !m.despues) return '';
  const saltar = new Set(['actualizado_en', 'creado_en']);
  return Object.keys(m.despues)
    .filter((k) => !saltar.has(k) && JSON.stringify(m.antes[k]) !== JSON.stringify(m.despues[k]))
    .map((k) => `${esc(k)}: <s style="color:var(--tenue)">${esc(m.antes[k])}</s> → <b>${esc(m.despues[k])}</b>`)
    .join(' · ');
}

function hojaHistorial(hoja) {
  hoja.innerHTML = `
    <div class="caja">
      <div class="herramientas"><h2 style="font-size:16px">Últimos movimientos</h2></div>
      ${estado.movimientos.length ? `<div style="overflow-x:auto"><table>
        <thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Detalle</th></tr></thead>
        <tbody>
        ${estado.movimientos.map((m) => {
          const [et, color] = ACCION[m.accion] || [m.accion, 'var(--suave)'];
          const nombre = (m.despues && m.despues.nombre) || (m.antes && m.antes.nombre) || m.registro_id;
          return `<tr>
            <td class="col" style="white-space:nowrap">${esc(fecha(m.creado_en))}</td>
            <td class="col">${esc(m.quien || '—')}</td>
            <td><span class="pildora" style="color:${color};border:1px solid currentColor">${et}</span>
                <span class="sku">${esc(m.registro_id)}</span></td>
            <td><div class="nom">${esc(nombre)}</div>
                <div class="col">${diferencias(m) || '—'}</div></td>
          </tr>`;
        }).join('')}
        </tbody></table></div>` : '<div class="vacio">Todavía no hay movimientos.</div>'}
    </div>`;
}

// ── Arranque ─────────────────────────────────────────────────────────────

async function arrancar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { pintarEntrada(); return; }

  // Esto es sólo para la pantalla. Lo que de verdad impide escribir es RLS:
  // aunque alguien saltee este if, la base le rechaza cada fila.
  if (cfg.adminEmail && (session.user.email || '').toLowerCase() !== cfg.adminEmail.toLowerCase()) {
    await sb.auth.signOut();
    pintarEntrada('Esta cuenta no tiene acceso al panel.');
    return;
  }

  estado.sesion = session;
  escuchar();
  try {
    await cargar();
  } catch (err) {
    estado.productos = []; estado.categorias = [];
    pintar();
    brindis(motivo(err), true);
  }
}

if (!listo) {
  pintarEntrada('Falta configurar rocketcards-config.js (o no cargó supabase-js).');
} else {
  arrancar();
}
</script>
