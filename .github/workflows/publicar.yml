# Construye el sitio y lo deja listo para Hostinger en la rama "publicado".
#
# Por qué una rama aparte: el despliegue por Git de Hostinger clona el repo
# dentro de public_html tal cual, sin construir nada. Si apunta a "main",
# termina publicando el fuente —la página se llama "Rocket Cards - Home.dc.html",
# no index.html— y de paso quedan a la vista db/, scripts/ y la carpeta .git
# con todo el historial.
#
# En "publicado" va sólo el resultado de scripts/build.mjs: index.html,
# admin.html, assets/ y el .htaccess, en la raíz. Eso es exactamente lo que
# tiene que haber en public_html.
#
# No hace falta configurar ningún secreto: GITHUB_TOKEN lo pone GitHub solo.
#
# Del lado de Hostinger (una sola vez):
#   hPanel → Avanzado → Git → repositorio del proyecto, rama "publicado",
#   carpeta public_html. Copiá la URL de webhook que te da y pegala en
#   GitHub → Settings → Webhooks, para que despliegue solo con cada push.

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:          # también se puede lanzar a mano desde Actions

permissions:
  contents: write             # para poder escribir la rama "publicado"

concurrency:
  # Dos commits seguidos no deben pisarse una publicación con la otra.
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir dist/
        run: node scripts/build.mjs

      - name: Comprobar que el build tiene lo que debe
        run: |
          for f in index.html admin.html support.js reveal.js rocketcards-config.js .htaccess; do
            test -s "dist/$f" || { echo "Falta dist/$f"; exit 1; }
          done
          test -d dist/assets || { echo "Falta dist/assets"; exit 1; }
          echo "dist/ tiene $(find dist -type f | wc -l) archivos."

      - name: Dejarlo en la rama "publicado"
        run: |
          # El asunto del commit, leído antes de entrar a dist/. Por git log y
          # no por github.event: así también sirve cuando se lanza a mano,
          # que no trae head_commit.
          TITULO=$(git log -1 --pretty=%s)
          cd dist
          # Historia nueva en cada publicación: a esta rama no le interesa el
          # pasado, y así no crece para siempre con copias de las fotos.
          git init -q -b publicado
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Build de ${GITHUB_SHA:0:7}: $TITULO"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            publicado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
